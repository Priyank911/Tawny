appId: com.tawny.desktop
productName: Tawny
asar: true
directories:
  output: release
  buildResources: public
files:
  - out/**/*
  - package.json
extraResources:
  - from: src/main/native/keywatcher.exe
    to: native/keywatcher.exe
    filter:
      - keywatcher.exe
  - from: build/native
    to: native
    filter:
      - tawny-control.exe
      - tawny-wake.exe
publish:
  - provider: github
    owner: Priyank911
    repo: Tawny
    releaseType: prerelease
win:
  icon: tawny-mark.svg
  target:
    - target: nsis
      arch:
        - x64
  verifyUpdateCodeSignature: false
  artifactName: Tawny-${version}-windows-${arch}.${ext}
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
