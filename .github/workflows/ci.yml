name: CI

on:
  pull_request:
  push:
    branches: ['**']

permissions:
  contents: read

jobs:
  verify:
    name: Verify on Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build and smoke-test the Windows helpers
        run: pnpm build:native
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: Package the native app bundle
        run: pnpm exec electron-builder --dir --publish never

